; SkyrimMouseRelease settings. Changes take effect the next time the game starts.

; 1 = free the mouse while one of the menus below is open, 0 = turn the mod off.
bReleaseMouse=1

; Menus that free the mouse, separated by commas. Journal Menu = pause menu, Main Menu = title screen,
; RaceSex Menu = character creator, Loading Menu = loading screens, InventoryMenu = items,
; MagicMenu = magic, StatsMenu = skills.
sMenus=Journal Menu, Main Menu, RaceSex Menu, Loading Menu, InventoryMenu, MagicMenu, StatsMenu

; 1 = write every menu event and cursor detail to the log (for bug reports), 0 = only the essentials.
; The log is Documents\My Games\Skyrim Special Edition\SKSE\SkyrimMouseRelease.log.
bVerboseLog=0

; Advanced: DirectInput cooperative flags restored when the menu closes.
; 5 = exclusive + foreground (Skyrim's normal mode). Only change this if the log says restoring failed.
iRestoreFlags=5
